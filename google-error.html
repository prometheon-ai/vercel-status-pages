<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Failed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .icon {
            width: 72px;
            height: 72px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            color: white;
        }
        h1 { 
            color: #111827; 
            font-size: 22px; 
            margin-bottom: 12px;
            font-weight: 600;
        }
        p { 
            color: #6b7280; 
            line-height: 1.6;
            font-size: 15px;
        }
        .error-detail {
            background: #fef2f2;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 20px;
            color: #991b1b;
            font-size: 13px;
            word-break: break-word;
            border: 1px solid #fecaca;
        }
        .footer { 
            margin-top: 28px; 
            color: #9ca3af; 
            font-size: 13px; 
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✕</div>
        <h1 id="title">Something went wrong</h1>
        <p>We couldn't complete the connection. Please try again.</p>
        <div class="error-detail" id="message"></div>
        <p class="footer">Contact support if the issue persists</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title');
        const message = params.get('message');
        
        if (title) {
            document.getElementById('title').textContent = title;
        }
        if (message) {
            document.getElementById('message').textContent = message;
        } else {
            document.getElementById('message').style.display = 'none';
        }
    </script>
</body>
</html>
