<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 48px;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            color: white;
        }
        h1 { color: #ef4444; margin-bottom: 16px; font-size: 24px; }
        p { color: #6b7280; word-break: break-word; line-height: 1.6; }
        .footer { margin-top: 32px; color: #9ca3af; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✗</div>
        <h1 id="title">Error</h1>
        <p id="message">Something went wrong</p>
        <p class="footer">Please try again or contact support</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('title').textContent = params.get('title') || 'Error';
        document.getElementById('message').textContent = params.get('message') || 'Something went wrong';
    </script>
</body>
</html>
