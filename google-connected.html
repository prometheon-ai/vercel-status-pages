<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Complete!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .icon {
            width: 72px;
            height: 72px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            color: white;
        }
        h1 { 
            color: #111827; 
            font-size: 22px; 
            margin-bottom: 8px;
            font-weight: 600;
        }
        .subtitle { 
            color: #6b7280; 
            font-size: 15px; 
            margin-bottom: 20px;
        }
        .email {
            background: #f1f5f9;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 28px;
            font-weight: 500;
            color: #334155;
            font-size: 14px;
        }
        .buttons { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .btn-primary { 
            background: #111827; 
            color: white; 
        }
        .btn-primary:hover { 
            background: #1f2937; 
        }
        .btn-secondary { 
            background: #f1f5f9; 
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        .btn-secondary:hover { 
            background: #e2e8f0; 
        }
        .footer { 
            margin-top: 28px; 
            color: #9ca3af; 
            font-size: 13px; 
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1 id="message">Connected! You're all set.</h1>
        <p class="subtitle">Signed in as:</p>
        <div class="email" id="email">Loading...</div>
        <div class="buttons" id="buttons"></div>
        <p class="footer">You can close this window</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('email').textContent = params.get('email') || 'Unknown';
        
        const message = params.get('message');
        if (message) {
            document.getElementById('message').textContent = message;
        }
        
        const buttons = document.getElementById('buttons');
        const sheet = params.get('sheet');
        const folder = params.get('folder');
        
        if (sheet) {
            buttons.innerHTML += `<a href="${sheet}" class="btn btn-primary" target="_blank">Open Your Sheet</a>`;
        }
        if (folder) {
            buttons.innerHTML += `<a href="${folder}" class="btn btn-secondary" target="_blank">Open Clients Folder</a>`;
        }
    </script>
</body>
</html>
