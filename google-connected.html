<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Complete!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 48px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            color: white;
        }
        h1 { color: #1f2937; font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #6b7280; font-size: 16px; margin-bottom: 24px; }
        .email {
            background: #f3f4f6;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 32px;
            font-weight: 600;
            color: #374151;
        }
        .buttons { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .btn-primary { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
        .btn-secondary { background: #f3f4f6; color: #374151; }
        .footer { margin-top: 32px; color: #9ca3af; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1 id="message">Your sheet is ready!</h1>
        <p class="subtitle">Connected as:</p>
        <div class="email" id="email">Loading...</div>
        <div class="buttons" id="buttons"></div>
        <p class="footer">You can close this window</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('email').textContent = params.get('email') || 'Unknown';
        document.getElementById('message').textContent = params.get('message') || 'Your sheet is ready!';
        
        const buttons = document.getElementById('buttons');
        const sheet = params.get('sheet');
        const folder = params.get('folder');
        
        if (sheet) {
            buttons.innerHTML += `<a href="${sheet}" class="btn btn-primary" target="_blank">Open Your Sheet</a>`;
        }
        if (folder) {
            buttons.innerHTML += `<a href="${folder}" class="btn btn-secondary" target="_blank">Open Clients Folder</a>`;
        }
    </script>
</body>
</html>
